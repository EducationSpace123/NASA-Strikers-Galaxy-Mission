<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà Tiên Tri Dị Giáo - 600 TCN</title>
    <style>
        :root {
            --bg-color: #090d16;
            --accent-gold: #f59e0b;
            --accent-red: #ef4444;
            --accent-blue: #38bdf8;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .game-wrapper {
            width: 95%;
            max-width: 900px;
            height: 90vh;
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #334155;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .header-bar {
            background: #020617;
            padding: 15px 25px;
            border-bottom: 2px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-bar h1 {
            font-size: 1.3rem;
            color: var(--accent-gold);
            letter-spacing: 1px;
        }

        .status-badge {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--accent-red);
            color: var(--accent-red);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .content-area {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dialogue-box {
            background: rgba(30, 41, 59, 0.8);
            border-left: 4px solid var(--accent-blue);
            padding: 18px;
            border-radius: 0 12px 12px 0;
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .panel-interactive {
            background: rgba(2, 6, 23, 0.6);
            border: 2px solid #475569;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .slider-container {
            margin: 20px 0;
        }

        .slider-container input[type=range] {
            width: 100%;
            height: 8px;
            background: #334155;
            outline: none;
            border-radius: 4px;
        }

        .btn-action {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-action:hover {
            transform: scale(1.05);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .option-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 2px solid #475569;
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: left;
            transition: 0.2s;
        }

        .option-btn:hover {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.1);
        }

        .input-number {
            background: #0f172a;
            border: 2px solid var(--accent-blue);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            width: 200px;
            margin: 10px 0;
            outline: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header-bar">
            <h1 id="chapterTitle">CHƯƠNG 1: CÚ HẠ CÁNH VÀ CÂY THẬP TỰ GIÁ</h1>
            <div class="status-badge" id="failCounter">⚠️ Số lỗi: 0/3</div>
        </div>

        <div class="content-area" id="contentArea">
            <!-- Nội dung sẽ được render tự động qua JavaScript -->
        </div>
    </div>

    <script>
        let gameState = {
            fails: 0,
            currentStage: 1,
            selectedDirection: null
        };

        const contentArea = document.getElementById('contentArea');
        const chapterTitle = document.getElementById('chapterTitle');
        const failCounter = document.getElementById('failCounter');

        function updateFailUI() {
            failCounter.innerText = `⚠️ Số lỗi: ${gameState.fails}/3`;
        }

        function renderStage() {
            contentArea.innerHTML = "";
            
            if (gameState.currentStage === 1) {
                chapterTitle.innerText = "CHƯƠNG 1: CÚ HẠ CÁNH VÀ CÂY THẬP TỰ GIÁ";
                contentArea.innerHTML = `
                    <div class="dialogue-box">
                        <strong>AI Lượng Tử:</strong> "Cảnh báo! Tàu Orion-7 phá hủy cấu trúc không thời gian. Vị trí hiện tại: Lưỡng Hà / Hy Lạp cổ đại, năm 600 TCN.<br><br>
                        Dân làng đang lôi ngươi ra bãi đất trống, dựng cây thập tự giá bằng gỗ sồi để chuẩn bị thiêu sống vì tội 'Ác quỷ từ trời rơi xuống'."
                    </div>
                    <div class="panel-interactive">
                        <p style="margin-bottom: 15px; font-size: 1.1rem; color: var(--accent-gold);">Lão Giáo sĩ gầm lên: 'Khai đi, mi là giống loài ma quỷ nào?!'</p>
                        <button class="btn-action" onclick="nextStage(2)">Thương lượng: "Tao là Đại Tiên Tri nắm giữ bí mật bầu trời!"</button>
                    </div>
                `;
            } 
            else if (gameState.currentStage === 2) {
                chapterTitle.innerText = "CHƯƠNG 2: BẢN VẼ TRÊN VÁCH ĐÁ (VÙNG GOLDILOCKS)";
                contentArea.innerHTML = `
                    <div class="dialogue-box">
                        <strong>Lão Giáo sĩ:</strong> "Nếu mi là Tiên Tri, hãy vẽ ngay cấu trúc Hệ Mặt Trời lên vách đá này! Nếu sai một li, ngọn lửa trên thập tự giá sẽ chờ sẵn mi!"<br><br>
                        <em>[Nhiệm vụ]: Dùng hệ thống lượng tử trượt thanh điều chỉnh khoảng cách Trái Đất so với Mặt Trời (Đơn vị Thiên văn - AU). Hãy chọn khoảng cách an toàn (Vùng Goldilocks)!</em>
                    </div>
                    <div class="panel-interactive">
                        <label>Khoảng cách Trái Đất - Mặt Trời: <span id="distVal" style="color:var(--accent-gold); font-weight:bold;">0.5</span> AU</label>
                        <div class="slider-container">
                            <input type="range" id="earthDist" min="0.1" max="3.0" step="0.1" value="0.5" oninput="document.getElementById('distVal').innerText=this.value">
                        </div>
                        <button class="btn-action" onclick="checkOrbit()">Khắc vách đá</button>
                    </div>
                `;
            }
            else if (gameState.currentStage === 3) {
                chapterTitle.innerText = "CHƯƠNG 3: CHỨNG MINH TRÁI ĐẤT TRÒN (THÍ NGHIỆM 2 CỌC)";
                contentArea.innerHTML = `
                    <div class="dialogue-box">
                        <strong>Học viện Hy Lạp:</strong> Sau khi cứu vãn mùa màng, đám học giả vẫn cãi cùn rằng Trái Đất là một chiếc đĩa phẳng. Cậu thanh niên thông minh tên <strong>Pythagoras</strong> bước ra thách thức.<br><br>
                        <em>[Nhiệm vụ]: Sai đồ đệ Pythagoras đi cắm cọc đo bóng nắng theo đúng phương hướng địa lý chuẩn xác. Ngươi sẽ lệnh cho cậu ta đi về hướng nào?</em>
                    </div>
                    <div class="options-grid">
                        <button class="option-btn" onclick="checkPythagoras('Dong')">➡️ Hướng Đông (Sang vùng Tiểu Á)</button>
                        <button class="option-btn" onclick="checkPythagoras('Nam')">⬇️ Hướng Nam (Xuống thành phố Syene)</button>
                        <button class="option-btn" onclick="checkPythagoras('Tay')">⬅️ Hướng Tây (Ra biển Aegean)</button>
                        <button class="option-btn" onclick="checkPythagoras('Bac')">⬆️ Hướng Bắc (Lên xứ Macedonia)</button>
                    </div>
                `;
            }
            else if (gameState.currentStage === 4) {
                chapterTitle.innerText = "CHƯƠNG 3 (Tiếp): GIẢI ĐỐ BÁN KÍNH TRÁI ĐẤT";
                contentArea.innerHTML = `
                    <div class="dialogue-box">
                        <strong>Thành công bước đầu!</strong> Đúng 12:00 trưa, cọc ở Syene không có bóng, trong khi cọc ở Athens vẫn lệch góc $\\alpha$. Pythagoras trợn tròn mắt chờ kết luận.<br><br>
                        <em>[Nhiệm vụ]: Nhập con số bán kính chuẩn xác của Trái Đất để bẻ gãy mọi luận điệu đĩa phẳng trước đám đông! (Gợi ý: Khoảng 6000 đến 7000 km).</em>
                    </div>
                    <div class="panel-interactive">
                        <input type="number" id="radiusInput" class="input-number" placeholder="Nhập số km..."><br>
                        <button class="btn-action" onclick="checkRadius()">Tuyên bố trước học viện</button>
                    </div>
                `;
            }
            else if (gameState.currentStage === 5) {
                chapterTitle.innerText = "CHƯƠNG 5: BÁ CHỦ CẦU (GOOD ENDING)";
                contentArea.innerHTML = `
                    <div class="dialogue-box" style="border-left-color: var(--accent-gold);">
                        🎉 <strong>HOÀN THÀNH XUẤT SẮC!</strong><br><br>
                        Bằng trí tuệ của một phi hành gia thế kỷ 22 kết hợp kiến thức vật lý thiên văn, ngươi đã chinh phục hoàn toàn thế giới cổ đại 600 TCN. Đám đông quỳ lạy, hàng ngàn đệ tử túc trực dâng hiến nguyên liệu chế tạo kính thiên văn.<br><br>
                        Ngươi được tôn vinh là <strong>Chúa Tể Tri Thức (God-King of Science)</strong>, đưa lịch sử nhân loại bước thẳng vào kỷ nguyên vũ trụ sớm hơn 2.500 năm!
                    </div>
                    <div class="panel-interactive">
                        <button class="btn-action" onclick="location.reload()">Chơi lại từ đầu</button>
                    </div>
                `;
            }
            else if (gameState.currentStage === 99) {
                chapterTitle.innerText = "BAD ENDING: CÂY THẬP TỰ GIÁ ĐỊNH MỆNH";
                contentArea.innerHTML = `
                    <div class="dialogue-box" style="border-left-color: var(--accent-red);">
                        💀 <strong>SAI SÓT 3 LẦN - THẤT BẠI HOÀN TOÀN!</strong><br><br>
                        Do những tính toán sai lầm liên tiếp về quỹ đạo và trắc địa, dân làng và giáo sĩ kết luận ngươi chỉ là một tên lừa đảo ngớ ngẩn. Ngươi bị trói chặt lên cây thập tự giá dưới cái nắng chói chang của năm 600 TCN... Cuộc đời nhà du hành vũ trụ chính thức khép lại trên cột gỗ!<br><br>
                        <em>AI Lượng tử tự hủy: "Thật là một trò hề không thể đỡ nổi..."</em>
                    </div>
                    <div class="panel-interactive">
                        <button class="btn-action" style="background:var(--accent-red); color:white;" onclick="location.reload()">Thử lại (Reboot)</button>
                    </div>
                `;
            }
        }

        function nextStage(stage) {
            gameState.currentStage = stage;
            renderStage();
        }

        function checkOrbit() {
            let val = parseFloat(document.getElementById('earthDist').value);
            // Vùng Goldilocks chuẩn là từ 0.9 đến 1.1 AU
            if (val >= 0.9 && val <= 1.1) {
                alert("✨ CHÍNH XÁC! Khoảng cách thuộc Vùng Goldilocks. Thời tiết ôn hòa, lúa mì xanh tốt lập tức bao trùm thung lũng!");
                nextStage(3);
            } else {
                gameState.fails++;
                updateFailUI();
                if (gameState.fails >= 3) {
                    nextStage(99);
                } else if (val < 0.9) {
                    alert(`❌ SAI LẦN ${gameState.fails}/3: Trái Đất quá gần Mặt Trời (Nhiệt độ 60°C, suối cạn khô)! Dân làng suýt lôi ngươi ra trói lên thập tự giá. Hãy thử lại.`);
                } else {
                    alert(`❌ SAI LẦN ${gameState.fails}/3: Trái Đất quá xa (Đóng băng toàn tập giữa mùa hè)! Hãy điều chỉnh lại.`);
                }
            }
        }

        function checkPythagoras(dir) {
            if (dir === 'Nam') {
                alert("🎯 CHUẨN XÁC! Pythagoras di chuyển đúng dọc theo kinh tuyến về phía Nam đến Syene, nơi có giếng sâu không bóng nắng lúc 12h trưa.");
                nextStage(4);
            } else {
                gameState.fails++;
                updateFailUI();
                if (gameState.fails >= 3) {
                    nextStage(99);
                } else {
                    alert(`❌ SAI LẦN ${gameState.fails}/3: Đi lệch hướng kinh tuyến khiến góc bóng nắng bị sai lệch hoàn toàn! Pythagoras gãi đầu chê sư phụ tính toán kém.`);
                }
            }
        }

        function checkRadius() {
            let radius = parseInt(document.getElementById('radiusInput').value);
            // Chấp nhận sai số từ 6000 đến 6800 km
            if (radius >= 6000 && radius <= 6800) {
                alert("🏆 HOÀN HẢO! Con số cực kỳ chuẩn xác so với thực tế (6.371 km). Đám học giả sụp gối bái lạy!");
                nextStage(5);
            } else {
                gameState.fails++;
                updateFailUI();
                if (gameState.fails >= 3) {
                    nextStage(99);
                } else {
                    alert(`❌ SAI LẦN ${gameState.fails}/3: Con số tính toán sai bét nhè! Đám đông bắt đầu nổi giận.`);
                }
            }
        }

        // Khởi động lần đầu
        renderStage();
    </script>
</body>
</html>
