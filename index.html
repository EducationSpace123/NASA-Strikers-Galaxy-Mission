<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Space Mission - Trò Chơi Không Gian</title>
    <style>
        :root {
            --bg-color: #050714;
            --text-color: #f0f4f8;
            --card-bg: rgba(11, 61, 145, 0.25);
            --card-border: rgba(30, 144, 255, 0.4);
            --nasa-blue: #0b3d91;
            --nasa-red: #fc3d21;
        }

        [data-theme="light"] {
            --bg-color: #f4f7fc;
            --text-color: #101820;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(11, 61, 145, 0.25);
            --nasa-blue: #0b3d91;
            --nasa-red: #d92b12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 20%, #101b3b 0%, var(--bg-color) 70%);
        }

        header {
            position: absolute;
            top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 850px;
            padding: 0 20px;
        }

        .nasa-badge {
            background: linear-gradient(135deg, #0b3d91, #1d4ed8);
            color: white;
            padding: 8px 16px;
            font-weight: 900;
            font-size: 1.1rem;
            border-radius: 8px;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 15px rgba(11, 61, 145, 0.7);
        }

        .btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            background: var(--nasa-blue);
            color: white;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            max-width: 850px;
            height: 550px;
            background: rgba(5, 7, 20, 0.9);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 7, 20, 0.88);
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .game-overlay h1 {
            color: var(--nasa-red);
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(252, 61, 33, 0.6);
        }

        .game-overlay p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            opacity: 0.9;
            line-height: 1.5;
        }

        .start-btn {
            background: var(--nasa-red);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(252, 61, 33, 0.7);
        }

        .start-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .controls-hint {
            margin-top: 15px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="nasa-badge">NASA ARCADE</div>
        <button class="btn" onclick="toggleTheme()">☀️ / 🌙 Giao Diện</button>
    </header>

    <div class="game-wrapper">
        <!-- Màn hình chờ -->
        <div class="game-overlay" id="startScreen">
            <h1>SỨ MỆNH KHÔNG GIAN</h1>
            <p>Điều khiển phi thuyền NASA tiêu diệt thiên thạch và sinh tồn!<br>Nâng cấp hỏa lực và vượt qua các cấp độ khó khăn.</p>
            <button class="start-btn" onclick="startGame()">KHỞI ĐỘNG SỨ MỆNH</button>
            <div class="controls-hint">Di chuyển: <b>Phím Mũi Tên</b> hoặc <b>A / D</b> | Bắn Laser: Phím <b>SPACE (Dấu cách)</b></div>
        </div>

        <!-- Màn hình kết thúc -->
        <div class="game-overlay" id="gameOverScreen" style="display: none;">
            <h1>KẾT THÚC SỨ MỆNH</h1>
            <p id="finalStats">Tổng điểm: 0 | Cấp độ đạt được: 1</p>
            <button class="start-btn" onclick="startGame()">CHƠI LẠI</button>
        </div>

        <canvas id="gameCanvas" width="850" height="550"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameRunning = false;
        let score = 0;
        let level = 1;
        let lives = 3;
        let invincibleTimer = 0;

        // Phi thuyền
        let ship = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 80,
            width: 50,
            height: 50,
            speed: 7
        };

        let keys = {};
        let bullets = [];
        let meteors = [];
        let particles = [];
        let stars = [];

        // Khởi tạo các ngôi sao nền
        for (let i = 0; i < 120; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 2 + 0.5
            });
        }

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
            // Bắn đạn bằng phím Space
            if (e.code === "Space" && gameRunning) {
                shootBullet();
                e.preventDefault();
            }
        });
        window.addEventListener("keyup", (e) => { keys[e.key] = false; });

        function shootBullet() {
            bullets.push({
                x: ship.x + ship.width / 2 - 3,
                y: ship.y,
                width: 6,
                height: 15,
                speed: 10
            });
        }

        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("gameOverScreen").style.display = "none";
            ship.x = canvas.width / 2 - 25;
            bullets = [];
            meteors = [];
            particles = [];
            score = 0;
            level = 1;
            lives = 3;
            invincibleTimer = 0;
            gameRunning = true;
            loop();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById("finalStats").innerText = `Tổng điểm: ${score} | Cấp độ đạt được: ${level}`;
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function spawnMeteor() {
            let spawnRate = Math.max(0.015, 0.035 - (level * 0.003));
            if (Math.random() < spawnRate) {
                let size = Math.random() * 35 + 20;
                meteors.push({
                    x: Math.random() * (canvas.width - size),
                    y: -size,
                    size: size,
                    speed: (Math.random() * 2 + 2) + (level * 0.5),
                    hp: Math.ceil(size / 20) // Thiên thạch to máu nhiều hơn
                });
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 6,
                    dy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 3 + 1,
                    life: 30,
                    color: color
                });
            }
        }

        function update() {
            // Tăng cấp độ theo điểm
            level = Math.floor(score / 150) + 1;

            // Điều khiển phi thuyền
            if (keys["ArrowLeft"] || keys["a"] || keys["A"]) ship.x -= ship.speed;
            if (keys["ArrowRight"] || keys["d"] || keys["D"]) ship.x += ship.speed;

            if (ship.x < 0) ship.x = 0;
            if (ship.x + ship.width > canvas.width) ship.x = canvas.width - ship.width;

            if (invincibleTimer > 0) invincibleTimer--;

            // Cập nhật sao nền
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            // Cập nhật đạn
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) bullets.splice(i, 1);
            }

            // Sinh và cập nhật thiên thạch
            spawnMeteor();
            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];
                m.y += m.speed;

                // Kiểm tra đạn bắn trúng thiên thạch
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (
                        b.x < m.x + m.size &&
                        b.x + b.width > m.x &&
                        b.y < m.y + m.size &&
                        b.y + b.height > m.y
                    ) {
                        m.hp--;
                        bullets.splice(j, 1);
                        if (m.hp <= 0) {
                            createExplosion(m.x + m.size/2, m.y + m.size/2, "#fc3d21");
                            meteors.splice(i, 1);
                            score += 25;
                            break;
                        }
                    }
                }

                // Kiểm tra va chạm với phi thuyền
                if (
                    invincibleTimer === 0 &&
                    ship.x < m.x + m.size &&
                    ship.x + ship.width > m.x &&
                    ship.y < m.y + m.size &&
                    ship.y + ship.height > m.y
                ) {
                    lives--;
                    invincibleTimer = 60; // 1 giây bất tử tạm thời
                    createExplosion(ship.x + ship.width/2, ship.y + ship.height/2, "#00b4d8");
                    meteors.splice(i, 1);
                    if (lives <= 0) {
                        gameOver();
                    }
                }

                // Xóa thiên thạch trôi qua màn hình
                if (m.y > canvas.height) {
                    meteors.splice(i, 1);
                    score += 5;
                }
            }

            // Cập nhật hạt hiệu ứng nổ
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vẽ sao nền
            ctx.fillStyle = "#ffffff";
            stars.forEach(star => {
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Vẽ phi thuyền NASA (nhấp nháy khi bất tử)
            if (invincibleTimer === 0 || Math.floor(invincibleTimer / 5) % 2 === 0) {
                ctx.fillStyle = "#1d4ed8";
                ctx.beginPath();
                ctx.moveTo(ship.x + ship.width / 2, ship.y);
                ctx.lineTo(ship.x, ship.y + ship.height);
                ctx.lineTo(ship.x + ship.width, ship.y + ship.height);
                ctx.closePath();
                ctx.fill();

                // Buồng lái phi thuyền
                ctx.fillStyle = "#00b4d8";
                ctx.beginPath();
                ctx.arc(ship.x + ship.width / 2, ship.y + 25, 6, 0, Math.PI * 2);
                ctx.fill();

                // Động cơ phản lực
                ctx.fillStyle = "#fc3d21";
                ctx.fillRect(ship.x + 12, ship.y + ship.height, 8, 10);
                ctx.fillRect(ship.x + 30, ship.y + ship.height, 8, 10);
            }

            // Vẽ đạn laser
            ctx.fillStyle = "#38bdf8";
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // Vẽ thiên thạch
            meteors.forEach(m => {
                ctx.fillStyle = "#64748b";
                ctx.beginPath();
                ctx.arc(m.x + m.size / 2, m.y + m.size / 2, m.size / 2, 0, Math.PI * 2);
                ctx.fill();
                // Chi tiết bề mặt
                ctx.fillStyle = "#334155";
                ctx.beginPath();
                ctx.arc(m.x + m.size / 3, m.y + m.size / 3, m.size / 5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Vẽ hạt hiệu ứng nổ
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });

            // Hiển thị thông tin HUD (Điểm, Cấp độ, Mạng)
            ctx.fillStyle = "#f0f4f8";
            ctx.font = "bold 16px Segoe UI";
            ctx.fillText(`Điểm: ${score}`, 20, 30);
            ctx.fillText(`Cấp độ: ${level}`, 20, 55);
            ctx.fillText(`Mạng sống: ${"❤️ ".repeat(lives)}`, canvas.width - 160, 30);
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'dark' ? 'light' : 'dark');
        }
    </script>
</body>
</html>
